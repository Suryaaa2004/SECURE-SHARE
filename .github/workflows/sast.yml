name: SAST Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Run Fluid Attacks SAST Scan
      run: |
        docker run --rm \
        -v ${{ github.workspace }}:/app \
        fluidattacks/sast sast scan /app
