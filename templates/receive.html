
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Secure File | SecureShare</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(90%, 440px);
      background: white;
      padding: 32px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 12px 40px #17203312;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #657089;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #3157d5;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #download:hover {
      background: #2445b5;
    }

    #home {
      margin-top: 12px;
      background: #e9eef8;
      color: #3157d5;
    }

    #home:hover {
      background: #dce5f5;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      color: #657089;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>🔐 SecureShare</h1>
    <p>Your file is encrypted. Download it securely.</p>

    <button id="download">
      Decrypt & Download
    </button>

    <button id="home" type="button">
      ← Home
    </button>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const token = "{{ token }}";

    const downloadButton = document.querySelector("#download");
    const homeButton = document.querySelector("#home");
    const status = document.querySelector("#status");

    function fromBase64Url(value) {
      value = value.replace(/-/g, "+").replace(/_/g, "/");
      value += "=".repeat((4 - value.length % 4) % 4);

      return Uint8Array.from(
        atob(value),
        character => character.charCodeAt(0)
      );
    }

    // Home button works independently of the download button.
    homeButton.addEventListener("click", () => {
      window.location.href = "/";
    });

    downloadButton.addEventListener("click", async () => {
      downloadButton.disabled = true;
      status.textContent = "Preparing secure download...";

      try {
        // Get the decryption key from the URL fragment.
        const keyParam = new URLSearchParams(
          window.location.hash.slice(1)
        ).get("key");

        if (!keyParam) {
          throw new Error(
            "Decryption key missing. Please use the complete share link."
          );
        }

        const rawKey = fromBase64Url(keyParam);

        // Get filename metadata before consuming the link.
        status.textContent = "Checking secure link...";

        const infoResponse = await fetch(`/api/info/${token}`);
        const info = await infoResponse.json();

        if (!infoResponse.ok) {
          throw new Error(
            info.error || "Link expired or unavailable."
          );
        }

        // Atomically consumes the one-time download link.
        status.textContent = "Downloading encrypted file...";

        const response = await fetch(`/api/download/${token}`, {
          method: "POST"
        });

        if (!response.ok) {
          const result = await response.json();
          throw new Error(
            result.error || "Download failed."
          );
        }

        const encrypted = new Uint8Array(
          await response.arrayBuffer()
        );

        // 12-byte IV + ciphertext + 16-byte AES-GCM tag.
        if (encrypted.length < 28) {
          throw new Error("Invalid encrypted file.");
        }

        const iv = encrypted.slice(0, 12);
        const ciphertext = encrypted.slice(12);

        status.textContent = "Decrypting file in your browser...";

        const key = await crypto.subtle.importKey(
          "raw",
          rawKey,
          "AES-GCM",
          false,
          ["decrypt"]
        );

        const plaintext = await crypto.subtle.decrypt(
          {
            name: "AES-GCM",
            iv: iv
          },
          key,
          ciphertext
        );

        const blob = new Blob([plaintext], {
          type: "application/octet-stream"
        });

        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");

        anchor.href = objectUrl;
        anchor.download = info.filename || "shared-file";

        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();

        // Revoke after the browser has started the download.
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);

        status.textContent =
          "File decrypted. This link can no longer be used.";

        // Remove the key from the visible URL.
        history.replaceState(
          null,
          "",
          window.location.pathname
        );

      } catch (error) {
        status.textContent = error.message;
        downloadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
