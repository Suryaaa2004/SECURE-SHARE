
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureShare - Encrypted File Sharing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(92%, 560px);
      background: white;
      padding: 36px;
      border-radius: 22px;
      box-shadow: 0 12px 40px #17203312;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      color: #657089;
      line-height: 1.5;
    }

    #drop {
      margin: 24px 0;
      padding: 36px 18px;
      border: 2px dashed #aab6ca;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      background: #fafcff;
      transition: 0.2s;
    }

    #drop:hover,
    #drop.active {
      border-color: #4263eb;
      background: #eef2ff;
    }

    #filename {
      margin-top: 12px;
      color: #172033;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      background: #3157d5;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2445b5;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      color: #172033;
      overflow-wrap: anywhere;
    }

    #linkbox {
      display: none;
      margin-top: 24px;
    }

    #link {
      width: 100%;
      padding: 12px;
      margin: 8px 0 12px;
      border: 1px solid #ccd4e2;
      border-radius: 8px;
      font-size: 14px;
    }

    #reset {
      margin-top: 12px;
      background: #e9eef8;
      color: #3157d5;
    }

    #reset:hover {
      background: #dce5f5;
    }

    .small {
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
<main>
  <h1>🔐 SecureShare</h1>
  <p>Encrypt a file and share it with a one-time link.</p>

  <div id="drop">
    <strong>Drop your file here</strong>
    <p>or click to browse</p>

    <input id="file" type="file" hidden>
    <div id="filename"></div>
  </div>

  <button id="share" disabled>
    Encrypt & Generate Link
  </button>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="linkbox">
    <p><strong>Your secure link</strong></p>

    <input id="link" readonly>

    <button id="copy">
      Copy Link
    </button>

    <button id="reset">
      ＋ Upload Another File
    </button>

    <p class="small">
      The decryption key is included in this link.
      Share it only with the intended recipient.
    </p>
  </div>
</main>

<script>
const drop = document.querySelector("#drop");
const fileInput = document.querySelector("#file");
const filename = document.querySelector("#filename");
const shareBtn = document.querySelector("#share");
const status = document.querySelector("#status");
const linkBox = document.querySelector("#linkbox");
const linkInput = document.querySelector("#link");
const copyBtn = document.querySelector("#copy");
const resetBtn = document.querySelector("#reset");

let selectedFile = null;

function selectFile(file) {
  if (!file) return;

  selectedFile = file;

  filename.textContent =
    `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

  shareBtn.disabled = false;
  linkBox.style.display = "none";
  status.textContent = "";
}

drop.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  selectFile(fileInput.files[0]);
});

drop.addEventListener("dragover", event => {
  event.preventDefault();
  drop.classList.add("active");
});

drop.addEventListener("dragleave", () => {
  drop.classList.remove("active");
});

drop.addEventListener("drop", event => {
  event.preventDefault();
  drop.classList.remove("active");

  selectFile(event.dataTransfer.files[0]);
});

function toBase64Url(bytes) {
  let binary = "";

  bytes.forEach(byte => {
    binary += String.fromCharCode(byte);
  });

  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

shareBtn.addEventListener("click", async () => {
  if (!selectedFile) return;

  shareBtn.disabled = true;
  status.textContent = "Encrypting file in your browser...";
  linkBox.style.display = "none";

  try {
    // Generate a random 256-bit AES key.
    const rawKey = crypto.getRandomValues(
      new Uint8Array(32)
    );

    const key = await crypto.subtle.importKey(
      "raw",
      rawKey,
      "AES-GCM",
      false,
      ["encrypt"]
    );

    // AES-GCM requires a unique 12-byte IV.
    const iv = crypto.getRandomValues(
      new Uint8Array(12)
    );

    const plaintext = await selectedFile.arrayBuffer();

    // Encrypt locally in the browser.
    const ciphertext = await crypto.subtle.encrypt(
      {
        name: "AES-GCM",
        iv: iv
      },
      key,
      plaintext
    );

    // Package IV + encrypted bytes.
    const packageBytes = new Uint8Array(
      iv.length + ciphertext.byteLength
    );

    packageBytes.set(iv, 0);

    packageBytes.set(
      new Uint8Array(ciphertext),
      iv.length
    );

    // Upload only encrypted data.
    const form = new FormData();

    form.append(
      "file",
      new Blob([packageBytes], {
        type: "application/octet-stream"
      }),
      "encrypted-file.enc"
    );

    form.append("filename", selectedFile.name);

    status.textContent = "Uploading encrypted file...";

    const response = await fetch("/api/upload", {
      method: "POST",
      body: form
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || "Upload failed."
      );
    }

    // Decryption key stays in the URL fragment.
    const secureLink =
      result.link + "#key=" + toBase64Url(rawKey);

    linkInput.value = secureLink;
    linkBox.style.display = "block";

    status.textContent =
      "File encrypted and ready to share!";

  } catch (error) {
    status.textContent = "Error: " + error.message;
  } finally {
    shareBtn.disabled = !selectedFile;
  }
});

// Copy generated secure link.
copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(linkInput.value);
    status.textContent = "Link copied!";
  } catch {
    linkInput.select();
    status.textContent =
      "Select and copy the link manually.";
  }
});

// Reset the upload page for another file.
resetBtn.addEventListener("click", () => {
  selectedFile = null;
  fileInput.value = "";
  filename.textContent = "";
  linkInput.value = "";

  linkBox.style.display = "none";
  shareBtn.disabled = true;

  status.textContent = "";
});
</script>
</body>
</html>
